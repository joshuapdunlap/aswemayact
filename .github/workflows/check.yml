# Runs the unit and end-to-end suites on every push and pull request, and a strict check
# of every external link on the first of each month (spec §9). Deploys stay manual
# (docs/DEPLOY.md). The build inside the e2e run checks external links; CI reaches the
# network directly, so NODE_USE_ENV_PROXY is not set here.
name: check

on:
  push:
  pull_request:
  schedule:
    - cron: '17 13 1 * *' # 13:17 UTC on the 1st of each month

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: scripts/recent-changes.ts (prebuild) builds the front door's
          # "Recently added" list from git log and keeps the committed file on a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  links:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-content.ts --strict-network
